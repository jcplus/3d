<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="version" content="1.0.3">
    <title>Native WebGPU Ocean</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; background: #082d3b; }
        #canvas-container, #canvas-container canvas { width: 100vw; height: 100vh; display: block; }
        #loading { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: #e5fbff; background: #082d3b; font: 16px/1.5 system-ui, sans-serif; text-align: center; z-index: 2; }
        #info { position: fixed; top: 12px; left: 12px; color: #e5fbff; font: 12px/1.45 ui-monospace, monospace; text-shadow: 0 1px 3px #000; pointer-events: none; z-index: 1; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="loading">正在初始化原生 WebGPU 海洋……</div>
    <div id="info">WASD：移动 · 拖动鼠标：视角 · 滚轮：高度</div>
    <script type="module" src="./main.js?v=1.0.3"></script>
</body>
</html>
